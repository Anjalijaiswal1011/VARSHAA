name: Continuous Integration & Production Quality Gate

on:
  push:
    branches: [main, master, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Lint, Security & Pytest Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (libspatialindex, netcdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev libspatialindex-dev netcdf-bin

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements/dev.txt

      - name: Ruff Code Quality & Formatting Linter
        run: |
          ruff check . --config pyproject.toml || true

      - name: Execute Full Pytest Test Suite
        env:
          ENV: test
          SECRET_KEY: ci-test-dummy-secret-key-32-chars-long!
          LOG_LEVEL: INFO
        run: |
          pytest tests/unit/ tests/integration/ --maxfail=5 -v

  frontend-test:
    name: Frontend TypeScript, Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type Check & Production Vite Build
        working-directory: ./frontend
        run: npm run build

      - name: Verify Build Artifacts
        working-directory: ./frontend
        run: |
          test -f dist/index.html
          echo "Frontend build successfully validated."

  docker-build-verify:
    name: Docker Containerization Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile.backend
          push: false
          tags: varshaa-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: deployment/Dockerfile.frontend
          push: false
          tags: varshaa-frontend:ci
